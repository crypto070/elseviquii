<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elseviqui</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }


    body {
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================================
       BACKGROUND IMAGE
       ========================================= */

    .background-image {
      position: fixed;
      inset: 0;
      z-index: 0;

      background-image:
        url("https://pub-efbc8c9c25f94c9f86351c1ad890f3ee.r2.dev/unnamed.jpg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 0;

      transition:
        opacity 2.5s ease;

      pointer-events: none;
    }


    .background-image.show {
      opacity: 1;
    }


    /* =========================================
       CAROUSEL
       ========================================= */

    .carousel {
      position: fixed;
      inset: 0;

      z-index: 1;

      overflow: hidden;

      opacity: 0;

      transition:
        opacity 2.5s ease;
    }


    .carousel.show {
      opacity: 1;
    }


    /* =========================================
       VIDEO CARDS
       ========================================= */

    .video-card {
      position: absolute;

      top: 0;

      width: 33.333333vw;
      height: 100vh;

      overflow: hidden;

      background: transparent;

      pointer-events: none;

      opacity: 0;

      left: 100vw;

      filter:
        brightness(0.3);

      transform:
        scale(0.94);

      z-index: 0;

      transition:
        left 0.85s cubic-bezier(.22,.8,.22,1),
        opacity 0.85s ease,
        filter 0.85s ease,
        transform 0.85s cubic-bezier(.22,.8,.22,1);

      will-change:
        left,
        opacity,
        filter,
        transform;
    }


    .video-card.left {
      left: 0;

      opacity: 0.55;

      filter:
        brightness(0.45);

      transform:
        scale(0.94);

      z-index: 1;
    }


    .video-card.center {
      left: 33.333333vw;

      opacity: 1;

      filter:
        brightness(1);

      transform:
        scale(1);

      z-index: 3;
    }


    .video-card.right {
      left: 66.666666vw;

      opacity: 0.55;

      filter:
        brightness(0.45);

      transform:
        scale(0.94);

      z-index: 1;
    }


    .video-card.hidden-left {
      left: -33.333333vw;

      opacity: 0;

      filter:
        brightness(0.3);

      transform:
        scale(0.94);

      z-index: 0;
    }


    .video-card.hidden-right {
      left: 100vw;

      opacity: 0;

      filter:
        brightness(0.3);

      transform:
        scale(0.94);

      z-index: 0;
    }


    /* =========================================
       ACTUAL VIDEO
       ========================================= */

    .video-card video {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      pointer-events: none;
    }


    /* =========================================
       VIDEO DIVIDERS
       ========================================= */

    .video-card.left::after,
    .video-card.center::after {
      content: "";

      position: absolute;

      top: 8%;
      bottom: 8%;
      right: 0;

      width: 1px;

      background:
        rgba(255, 255, 255, 0.10);

      pointer-events: none;
    }


    /* =========================================
       DARK OVERLAY
       ========================================= */

    .video-overlay {
      position: fixed;
      inset: 0;

      z-index: 2;

      background:
        rgba(0, 0, 0, 0.16);

      opacity: 0;

      transition:
        opacity 2.5s ease;

      pointer-events: none;
    }


    .video-overlay.show {
      opacity: 1;
    }


    /* =========================================
       ARROWS
       ========================================= */

    .carousel-arrow {
      position: fixed;

      top: 0;
      bottom: 0;

      width: 14vw;

      z-index: 20;

      display: flex;

      align-items: center;
      justify-content: center;

      border: none;
      outline: none;

      color:
        rgba(255, 255, 255, 0.32);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(4rem, 10vw, 8rem);

      font-weight: 200;

      cursor: pointer;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 1s ease,
        color 0.25s ease;
    }


    body.started .carousel-arrow {
      opacity: 1;
      pointer-events: auto;
    }


    .carousel-arrow-left {
      left: 0;

      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.26) 0%,
          rgba(0, 0, 0, 0.18) 25%,
          rgba(0, 0, 0, 0.10) 50%,
          rgba(0, 0, 0, 0.04) 75%,
          rgba(0, 0, 0, 0) 100%
        );
    }


    .carousel-arrow-right {
      right: 0;

      background:
        linear-gradient(
          to left,
          rgba(0, 0, 0, 0.26) 0%,
          rgba(0, 0, 0, 0.18) 25%,
          rgba(0, 0, 0, 0.10) 50%,
          rgba(0, 0, 0, 0.04) 75%,
          rgba(0, 0, 0, 0) 100%
        );
    }


    .carousel-arrow-left:hover {
      background:
        linear-gradient(
          to right,
          rgba(255, 255, 255, 0.09) 0%,
          rgba(255, 255, 255, 0.055) 30%,
          rgba(255, 255, 255, 0.025) 60%,
          rgba(255, 255, 255, 0) 100%
        );

      color:
        rgba(255, 255, 255, 0.70);
    }


    .carousel-arrow-right:hover {
      background:
        linear-gradient(
          to left,
          rgba(255, 255, 255, 0.09) 0%,
          rgba(255, 255, 255, 0.055) 30%,
          rgba(255, 255, 255, 0.025) 60%,
          rgba(255, 255, 255, 0) 100%
        );

      color:
        rgba(255, 255, 255, 0.70);
    }


    .carousel-arrow:active {
      color:
        rgba(255, 255, 255, 1);
    }


    /* =========================================
       MAIN CONTENT
       ========================================= */

    .container {
      position: fixed;
      inset: 0;

      z-index: 5;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      pointer-events: none;
    }


    /* =========================================
       MAIN INSTAGRAM TITLE
       ========================================= */

    .instagram {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 10px;

      opacity: 0;

      transform:
        translateY(40px);

      filter:
        blur(10px);

      pointer-events: auto;
    }


    .instagram.show {
      animation:
        instagramMainFade
        2.5s
        ease
        forwards;
    }


    /* =========================================
       SMALL "FOLLOW" / "ON INSTAGRAM"
       ========================================= */

    .instagram-minor {
      font-size:
        clamp(0.55rem, 0.9vw, 0.78rem);

      font-weight: 400;

      letter-spacing:
        0.48em;

      text-transform: uppercase;

      color:
        rgba(255, 255, 255, 0.48);

      transition:
        color 0.6s ease,
        letter-spacing 0.6s ease,
        opacity 0.6s ease;
    }


    /* =========================================
       LARGE ELSEVIQUI LINK
       ========================================= */

    .instagram-title {
      display: inline-block;

      color:
        rgba(255, 255, 255, 0.96);

      text-decoration: none;

      font-size:
        clamp(4rem, 10vw, 8.5rem);

      font-weight: 300;

      line-height: 0.95;

      letter-spacing:
        0.08em;

      text-transform: none;

      transform:
        translateY(0)
        scale(1);

      text-shadow:
        0 0 0
        rgba(255, 255, 255, 0);

      transition:
        transform 0.8s cubic-bezier(.16,1,.3,1),
        letter-spacing 0.8s cubic-bezier(.16,1,.3,1),
        color 0.6s ease,
        text-shadow 0.8s ease;
    }


    /* =========================================
       ELSEVIQUI HOVER
       ========================================= */

    .instagram-title:hover {
      color: white;

      letter-spacing:
        0.13em;

      transform:
        translateY(-7px)
        scale(1.035);

      text-shadow:
        0 0 10px rgba(255, 255, 255, 0.24),
        0 0 28px rgba(255, 255, 255, 0.13),
        0 0 60px rgba(255, 255, 255, 0.055);
    }


    .instagram:has(.instagram-title:hover)
    .instagram-minor {
      color:
        rgba(255, 255, 255, 0.70);

      letter-spacing:
        0.55em;
    }


    /* =========================================
       INSTAGRAM INTRO ANIMATION
       ========================================= */

    @keyframes instagramMainFade {

      0% {
        opacity: 0;

        transform:
          translateY(40px);

        filter:
          blur(10px);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0);

        filter:
          blur(0);
      }

    }


    /* =========================================
       MUSIC SECTION
       ========================================= */

    .music-section {
      margin-top: 60px;

      opacity: 0;

      transform:
        translateY(20px);

      pointer-events: auto;
    }


    .music-section.show {
      animation:
        textFade
        2s
        ease
        forwards;
    }


    /* =========================================
       SELECT TRACK LABEL
       ========================================= */

    .select-track {
      margin-bottom: 16px;

      font-size: 0.58rem;

      letter-spacing:
        0.35em;

      text-transform: uppercase;

      color:
        rgba(255, 255, 255, 0.55);

      opacity: 1;

      max-height: 30px;

      overflow: hidden;

      transform:
        translateY(0);

      transition:
        opacity 0.45s ease,
        max-height 0.45s ease,
        margin 0.45s ease,
        transform 0.45s ease;
    }


    /* =========================================
       MUSIC OPTIONS
       ========================================= */

    .music-options {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 18px;

      flex-wrap: nowrap;

      transition:
        gap 0.55s cubic-bezier(.2,.8,.2,1);
    }


    /* =========================================
       SONG BUTTON
       ========================================= */

    .song-option {
      border:
        1px solid
        rgba(255, 255, 255, 0.28);

      background:
        rgba(0, 0, 0, 0.20);

      color:
        rgba(255, 255, 255, 0.72);

      padding:
        13px 20px;

      border-radius:
        999px;

      font-family: inherit;

      font-size:
        0.72rem;

      letter-spacing:
        0.10em;

      text-transform: uppercase;

      cursor: pointer;

      white-space: nowrap;

      overflow: hidden;

      opacity: 1;

      max-width: 320px;

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      transform:
        translateY(0)
        scale(1);

      transition:
        opacity 0.45s ease,
        max-width 0.55s cubic-bezier(.2,.8,.2,1),
        padding 0.55s cubic-bezier(.2,.8,.2,1),
        border-width 0.45s ease,
        transform 0.45s cubic-bezier(.2,.8,.2,1),
        background 0.30s ease,
        border-color 0.30s ease,
        color 0.30s ease,
        box-shadow 0.30s ease;
    }


    .song-option:hover {
      transform:
        translateY(-8px)
        scale(1.09);

      background:
        rgba(255, 255, 255, 0.12);

      border-color:
        rgba(255, 255, 255, 0.65);

      color: white;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.30);
    }


    .song-option:active {
      transform:
        translateY(-3px)
        scale(1.03);
    }


    .song-option.active {
      background:
        rgba(255, 255, 255, 0.16);

      border-color:
        rgba(255, 255, 255, 0.75);

      color: white;
    }


    /* =========================================
       NOW PLAYING
       ========================================= */

    .now-playing {
      margin-top: 25px;

      font-size: 0.62rem;

      letter-spacing:
        0.22em;

      text-transform: uppercase;

      color:
        rgba(255, 255, 255, 0.58);

      opacity: 1;

      max-height: 30px;

      overflow: hidden;

      transform:
        translateY(0);

      transition:
        opacity 0.45s ease,
        max-height 0.45s ease,
        margin 0.45s ease,
        transform 0.45s ease;
    }


    .now-playing-song {
      color:
        rgba(255, 255, 255, 0.9);
    }


    /* =========================================
       COLLAPSED MUSIC
       ========================================= */

    .music-section.collapsed .select-track {
      opacity: 0;

      max-height: 0;

      margin-bottom: 0;

      transform:
        translateY(-8px);
    }


    .music-section.collapsed .now-playing {
      opacity: 0;

      max-height: 0;

      margin-top: 0;

      transform:
        translateY(-8px);
    }


    .music-section.collapsed .music-options {
      gap: 0;
    }


    .music-section.collapsed
    .song-option:not(.active) {

      opacity: 0;

      max-width: 0;

      padding-left: 0;
      padding-right: 0;

      border-left-width: 0;
      border-right-width: 0;

      pointer-events: none;

      transform:
        scale(0.72);
    }


    .music-section.collapsed
    .song-option.active {

      opacity: 1;

      max-width: 320px;

      transform:
        translateY(0)
        scale(1);
    }


    .music-section.collapsed
    .song-option.active:hover {

      transform:
        translateY(-5px)
        scale(1.05);
    }


    /* =========================================
       SLOW TRACK EXPANSION
       ========================================= */

    .music-section.expanding .song-option {
      transition:
        opacity 1.05s ease,
        max-width 1.15s cubic-bezier(.16,1,.3,1),
        padding 1.15s cubic-bezier(.16,1,.3,1),
        border-width 1.05s ease,
        transform 1.05s cubic-bezier(.16,1,.3,1),
        background 0.30s ease,
        border-color 0.30s ease,
        color 0.30s ease,
        box-shadow 0.30s ease;
    }


    .music-section.expanding .music-options {
      transition:
        gap 1.15s cubic-bezier(.16,1,.3,1);
    }


    .music-section.expanding .select-track,
    .music-section.expanding .now-playing {
      transition:
        opacity 0.9s ease,
        max-height 1.05s cubic-bezier(.16,1,.3,1),
        margin 1.05s cubic-bezier(.16,1,.3,1),
        transform 1.05s cubic-bezier(.16,1,.3,1);
    }


    /* =========================================
       VISUALIZER
       ========================================= */

    .visualizer {
      height: 25px;

      margin-top: 13px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 4px;
    }


    .bar {
      width: 3px;
      height: 5px;

      border-radius: 5px;

      background:
        rgba(255, 255, 255, 0.7);

      animation:
        audioBar
        0.8s
        ease-in-out
        infinite
        alternate;
    }


    .bar:nth-child(1) {
      animation-duration: 0.55s;
    }

    .bar:nth-child(2) {
      animation-duration: 0.8s;
    }

    .bar:nth-child(3) {
      animation-duration: 0.65s;
    }

    .bar:nth-child(4) {
      animation-duration: 0.95s;
    }

    .bar:nth-child(5) {
      animation-duration: 0.7s;
    }

    .bar:nth-child(6) {
      animation-duration: 0.5s;
    }

    .bar:nth-child(7) {
      animation-duration: 0.85s;
    }

    .bar:nth-child(8) {
      animation-duration: 0.62s;
    }

    .bar:nth-child(9) {
      animation-duration: 0.75s;
    }

    .bar:nth-child(10) {
      animation-duration: 0.48s;
    }


    @keyframes audioBar {

      from {
        height: 4px;
        opacity: 0.45;
      }

      to {
        height: 22px;
        opacity: 1;
      }

    }


    /* =========================================
       TEXT FADE
       ========================================= */

    @keyframes textFade {

      0% {
        opacity: 0;

        transform:
          translateY(20px);
      }

      100% {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================================
       ENTER SCREEN
       ========================================= */

    #startScreen {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: flex;

      justify-content: center;
      align-items: center;

      background: black;

      cursor: pointer;

      transition:
        opacity 1.5s ease;
    }


    #startScreen p {
      color: white;

      font-size: 0.8rem;

      letter-spacing:
        0.3em;

      text-transform: uppercase;

      opacity: 0.6;

      animation:
        pulse
        2s
        infinite;
    }


    @keyframes pulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (orientation: portrait) {


      .video-card {
        width: 100vw;
        height: 100vh;

        top: 0;
      }


      .video-card.center {
        left: 0;

        opacity: 1;

        transform:
          scale(1);

        filter:
          brightness(1);

        z-index: 3;
      }


      .video-card.left {
        left: -100vw;

        opacity: 0;
      }


      .video-card.right {
        left: 100vw;

        opacity: 0;
      }


      .video-card.hidden-left {
        left: -100vw;

        opacity: 0;
      }


      .video-card.hidden-right {
        left: 100vw;

        opacity: 0;
      }


      .video-card.left::after,
      .video-card.center::after {
        display: none;
      }


      .carousel-arrow {
        width: 24vw;

        font-size:
          clamp(4rem, 18vw, 8rem);
      }


      .instagram {
        gap: 8px;

        padding:
          0 18px;
      }


      .instagram-minor {
        font-size:
          0.50rem;

        letter-spacing:
          0.40em;
      }


      .instagram-title {
        font-size:
          clamp(3.2rem, 17vw, 6rem);

        letter-spacing:
          0.07em;

        line-height: 1;
      }


      .music-section {
        width: 100%;

        margin-top: 52px;

        padding:
          0 16px;
      }


      .music-options {
        display: flex;

        flex-direction: column;

        align-items: center;
        justify-content: center;

        gap: 12px;
      }


      .song-option {
        width:
          min(78vw, 320px);

        max-width:
          min(78vw, 320px);

        padding:
          12px 16px;

        font-size:
          0.60rem;
      }


      .music-section.collapsed
      .music-options {
        gap: 0;
      }


      .music-section.collapsed
      .song-option:not(.active) {

        width: 0;

        max-width: 0;

        height: 0;

        padding-top: 0;
        padding-bottom: 0;
        padding-left: 0;
        padding-right: 0;

        border-width: 0;

        opacity: 0;

        transform:
          scale(0.7);
      }


      .music-section.collapsed
      .song-option.active {

        width:
          min(78vw, 320px);

        max-width:
          min(78vw, 320px);
      }


      .now-playing {
        font-size:
          0.48rem;
      }

    }

  </style>
</head>

      </a>


      <span class="instagram-minor">
        on instagram
      </span>

    </div>


    <div
      class="music-section"
      id="musicSection"
    >


      <p
        class="select-track"
        id="selectTrackLabel"
      >
        Select Track
      </p>


      <div
        class="music-options"
        id="musicOptions"
      >


        <button
          class="song-option"
          type="button"
          data-song="0"
        >
          Stupid for You
        </button>


        <button
          class="song-option active"
          type="button"
          data-song="1"
        >
          New England Palm Trees
        </button>


        <button
          class="song-option"
          type="button"
          data-song="2"
        >
          Octane
        </button>


      </div>


      <p
        class="now-playing"
        id="nowPlaying"
      >

        NOW PLAYING&nbsp; • &nbsp;

        <span
          class="now-playing-song"
          id="nowPlayingSong"
        >
          NEW ENGLAND PALM TREES
        </span>

      </p>


      <div class="visualizer">

        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>

      </div>


    </div>


  </main>


  <button
    class="carousel-arrow carousel-arrow-left"
    id="carouselLeft"
    type="button"
    aria-label="Previous video"
  >
    ‹
  </button>


  <button
    class="carousel-arrow carousel-arrow-right"
    id="carouselRight"
    type="button"
    aria-label="Next video"
  >
    ›
  </button>


  <div id="startScreen">

    <p>
      click to enter
    </p>

  </div>


  <audio
    id="musicPlayer"
    loop
    preload="auto"
  ></audio>


  <script>


    const cloudflareBase =
      "https://pub-efbc8c9c25f94c9f86351c1ad890f3ee.r2.dev/";


    const songs = [

      {
        name: "Stupid for You",
        file: "Stupid for You.mp3"
      },

      {
        name: "New England Palm Trees",
        file: "New England Palm Trees.mp3"
      },

      {
        name: "Octane",
        file: "Until I Wake - Octane (Official Music Video).mp3"
      }

    ];


    const startScreen =
      document.getElementById(
        "startScreen"
      );


    const backgroundImage =
      document.getElementById(
        "backgroundImage"
      );


    const carousel =
      document.getElementById(
        "carousel"
      );


    const videoOverlay =
      document.getElementById(
        "videoOverlay"
      );


    const instagram =
      document.getElementById(
        "instagram"
      );


    const musicSection =
      document.getElementById(
        "musicSection"
      );


    const musicPlayer =
      document.getElementById(
        "musicPlayer"
      );


    const songOptions =
      document.querySelectorAll(
        ".song-option"
      );


    const nowPlayingSong =
      document.getElementById(
        "nowPlayingSong"
      );


    const carouselLeft =
      document.getElementById(
        "carouselLeft"
      );


    const carouselRight =
      document.getElementById(
        "carouselRight"
      );


    const touchMode =
      window.matchMedia(
        "(hover: none), (pointer: coarse)"
      );


    function isTouchDevice() {

      return touchMode.matches;

    }


    musicPlayer.volume = 0.01;


    function getSongURL(
      fileName
    ) {

      return (
        cloudflareBase +
        encodeURIComponent(
          fileName
        )
      );

    }


    function loadSong(
      songIndex,
      autoplay = true
    ) {


      const selectedSong =
        songs[songIndex];


      musicPlayer.src =
        getSongURL(
          selectedSong.file
        );


      musicPlayer.load();


      nowPlayingSong.textContent =
        selectedSong.name;


      songOptions.forEach(
        option => {

          option.classList.remove(
            "active"
          );

        }
      );


      const activeOption =
        document.querySelector(
          `[data-song="${songIndex}"]`
        );


      if (activeOption) {

        activeOption
          .classList
          .add(
            "active"
          );

      }


      if (autoplay) {

        musicPlayer
          .play()
          .catch(
            error => {

              console.log(
                "Music failed:",
                error
              );

            }
          );

      }

    }


    loadSong(
      1,
      false
    );


    let trackCollapseTimer = null;

    let expansionCleanupTimer = null;


    function clearTrackCollapseTimer() {

      if (
        trackCollapseTimer
      ) {

        clearTimeout(
          trackCollapseTimer
        );

        trackCollapseTimer = null;

      }

    }


    function clearExpansionCleanupTimer() {

      if (
        expansionCleanupTimer
      ) {

        clearTimeout(
          expansionCleanupTimer
        );

        expansionCleanupTimer = null;

      }

    }


    function collapseTrackSelector() {

      clearTrackCollapseTimer();

      clearExpansionCleanupTimer();


      musicSection
        .classList
        .remove(
          "expanding"
        );


      musicSection
        .classList
        .add(
          "collapsed"
        );

    }


    function expandTrackSelector() {

      clearTrackCollapseTimer();

      clearExpansionCleanupTimer();


      musicSection
        .classList
        .add(
          "expanding"
        );


      requestAnimationFrame(
        () => {

          musicSection
            .classList
            .remove(
              "collapsed"
            );

        }
      );


      expansionCleanupTimer =
        setTimeout(
          () => {

            musicSection
              .classList
              .remove(
                "expanding"
              );

            expansionCleanupTimer = null;

          },

          1200
        );

    }


    function scheduleTrackCollapse(
      delay = 4000
    ) {

      clearTrackCollapseTimer();


      trackCollapseTimer =
        setTimeout(
          () => {

            collapseTrackSelector();

          },

          delay
        );

    }


    songOptions.forEach(
      option => {

        option.addEventListener(
          "click",
          event => {


            event.stopPropagation();


            const songIndex =
              Number(
                option.dataset.song
              );


            const isActive =
              option.classList.contains(
                "active"
              );


            const isCollapsed =
              musicSection
                .classList
                .contains(
                  "collapsed"
                );


            if (
              isTouchDevice()
            ) {


              if (
                isCollapsed &&
                isActive
              ) {

                expandTrackSelector();

                return;

              }


              if (
                !isCollapsed &&
                isActive
              ) {

                collapseTrackSelector();

                return;

              }


              loadSong(
                songIndex,
                true
              );


              setTimeout(
                () => {

                  collapseTrackSelector();

                },

                250
              );


              return;

            }


            loadSong(
              songIndex,
              true
            );


          }
        );

      }
    );


    musicSection.addEventListener(
      "mouseenter",
      () => {


        if (
          !isTouchDevice()
        ) {

          expandTrackSelector();

        }


      }
    );


    musicSection.addEventListener(
      "mouseleave",
      () => {


        if (
          !isTouchDevice()
        ) {

          scheduleTrackCollapse(
            700
          );

        }


      }
    );


    document.addEventListener(
      "pointerdown",
      event => {


        if (
          !isTouchDevice()
        ) {

          return;

        }


        if (
          musicSection
            .classList
            .contains(
              "collapsed"
            )
        ) {

          return;

        }


        if (
          !musicSection
            .contains(
              event.target
            )
        ) {

          collapseTrackSelector();

        }


      }
    );


    let cards =
      Array.from(
        document.querySelectorAll(
          ".video-card"
        )
      );


    let moving = false;

    let websiteStarted = false;


    function updatePositions() {


      cards.forEach(
        card => {

          card.classList.remove(
            "left",
            "center",
            "right",
            "hidden-left",
            "hidden-right"
          );

        }
      );


      cards[0]
        .classList
        .add(
          "left"
        );


      cards[1]
        .classList
        .add(
          "center"
        );


      cards[2]
        .classList
        .add(
          "right"
        );


      cards[
        cards.length - 1
      ]
        .classList
        .add(
          "hidden-left"
        );


      for (
        let i = 3;
        i < cards.length - 1;
        i++
      ) {

        cards[i]
          .classList
          .add(
            "hidden-right"
          );

      }


      if (
        websiteStarted
      ) {

        playCenterVideo();

      }

    }


    function playCenterVideo() {


      cards.forEach(
        card => {


          const video =
            card.querySelector(
              "video"
            );


          if (
            card
              .classList
              .contains(
                "center"
              )
          ) {


            video.currentTime = 0;


            video
              .play()
              .catch(
                error => {

                  console.log(
                    "Center video failed:",
                    error
                  );

                }
              );


          }

          else {


            video.pause();

            video.currentTime = 0;


          }


        }
      );

    }


    function moveLeft() {


      if (
        moving ||
        !websiteStarted
      ) {

        return;

      }


      moving = true;


      cards.push(
        cards.shift()
      );


      updatePositions();


      setTimeout(
        () => {

          moving = false;

        },

        900
      );

    }


    function moveRight() {


      if (
        moving ||
        !websiteStarted
      ) {

        return;

      }


      moving = true;


      cards.unshift(
        cards.pop()
      );


      updatePositions();


      setTimeout(
        () => {

          moving = false;

        },

        900
      );

    }


    carouselLeft.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        moveRight();

      }
    );


    carouselRight.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        moveLeft();

      }
    );


    window.addEventListener(
      "wheel",
      event => {


        if (
          !websiteStarted ||
          moving
        ) {

          return;

        }


        const movement =
          Math.abs(
            event.deltaX
          ) >
          Math.abs(
            event.deltaY
          )

            ? event.deltaX

            : event.deltaY;


        if (
          movement > 0
        ) {

          moveLeft();

        }


        else if (
          movement < 0
        ) {

          moveRight();

        }


      },
      {
        passive: true
      }
    );


    window.addEventListener(
      "keydown",
      event => {


        if (
          !websiteStarted
        ) {

          return;

        }


        if (
          event.key ===
          "ArrowRight"
        ) {

          moveLeft();

        }


        if (
          event.key ===
          "ArrowLeft"
        ) {

          moveRight();

        }


      }
    );


    startScreen.addEventListener(
      "click",
      () => {


        websiteStarted = true;


        document.body
          .classList
          .add(
            "started"
          );


        updatePositions();

        playCenterVideo();


        musicPlayer.currentTime = 0;


        musicPlayer
          .play()
          .catch(
            error => {

              console.log(
                "Music failed:",
                error
              );

            }
          );


        backgroundImage
          .classList
          .add(
            "show"
          );


        carousel
          .classList
          .add(
            "show"
          );


        videoOverlay
          .classList
          .add(
            "show"
          );


        startScreen.style.opacity =
          "0";


        setTimeout(
          () => {

            startScreen.style.display =
              "none";

          },

          1500
        );


        setTimeout(
          () => {


            instagram
              .classList
              .add(
                "show"
              );


            setTimeout(
              () => {


                musicSection
                  .classList
                  .add(
                    "show"
                  );


                scheduleTrackCollapse(
                  4000
                );


              },

              700
            );


          },

          4500
        );


      }
    );


  </script>

</body>

</html>
